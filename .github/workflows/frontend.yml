name: Frontend CI/CD

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'vault-front/**'
      - '.github/workflows/frontend.yml'
      - 'frontend.Dockerfile'
      - 'docker-compose.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'vault-front/**'
      - 'frontend.Dockerfile'
      - 'docker-compose.yml'

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    name: Lint & Build Frontend
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: vault-front/package-lock.json

      - name: Install dependencies
        working-directory: vault-front
        run: npm ci

      - name: Lint
        working-directory: vault-front
        run: npm run lint

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository owner
        id: prepare
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend.Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ steps.prepare.outputs.owner }}/vault-frontend:latest
            ghcr.io/${{ steps.prepare.outputs.owner }}/vault-frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=${{ secrets.NEXT_PUBLIC_BACKEND_URL }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Kubernetes deployment image tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # Start from the current main instead of rebasing an edit of the same line:
          # two runs bumping the tag concurrently used to conflict.
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --unshallow origin main || git fetch origin main
          FILE=k8s/services/frontend/base/deployment.yaml
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main
            CURRENT=$(grep -m1 -oE 'vault-frontend:[0-9a-f]{40}' "$FILE" | cut -d: -f2 || true)
            # Never move the tag back to an older commit when a newer run already deployed
            if [ -n "$CURRENT" ] && [ "$CURRENT" != "${{ github.sha }}" ] && git merge-base --is-ancestor "${{ github.sha }}" "$CURRENT" 2>/dev/null; then
              echo "A newer image ($CURRENT) is already deployed, skipping."
              exit 0
            fi
            sed -i -E 's|(image:\s*ghcr\.io/[a-zA-Z0-9_-]+/vault-frontend):.*|\1:'"${{ github.sha }}"'|g' "$FILE"
            git add "$FILE"
            if git diff --cached --quiet; then
              echo "No changes to commit"
              exit 0
            fi
            git commit -m "chore(deploy): update frontend image tag to ${{ github.sha }} [skip ci]"
            if git push origin main; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt), retrying on the new main"
            sleep 5
          done
          exit 1



